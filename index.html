<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QXVbrand - Smart Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes goldGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
            50% { filter: drop-shadow(0 0 35px rgba(255,223,0,0.8)); }
        }

        .gold-text {
            background: linear-gradient(135deg, #FFF5C0 0%, #D4AF37 40%, #FFFFFF 50%, #B38728 60%, #AA7C11 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        .gold-card {
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.35);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(212, 175, 55, 0.08);
        }

        .gold-button {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 30%, #B38728 70%, #AA7C11 100%);
            color: #000;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }

        .gold-button:active {
            transform: scale(0.96);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased h-screen flex flex-col justify-between overflow-hidden relative">

    <!-- CANVAS BACKGROUND (GOLD DUST & RAIN) -->
    <canvas id="bg-canvas"></canvas>

    <!-- 1. SPLASH SCREEN (EXACTLY 5 SECONDS TIMER) -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
        <div class="text-center p-8 gold-card rounded-3xl max-w-sm w-full mx-4 relative z-10">
            <div class="w-24 h-24 mx-auto mb-5 rounded-full border-2 border-yellow-500/60 flex items-center justify-center bg-yellow-500/10 shadow-2xl shadow-yellow-500/40">
                <i class="fa-solid fa-crown text-5xl gold-text"></i>
            </div>
            <h1 class="text-3xl font-black tracking-widest gold-text mb-2">QXVbrand</h1>
            <p class="text-xs text-yellow-200/80 uppercase tracking-widest mb-6">PREMIUM TIZIMGA XUSH KELIBSIZ</p>
            
            <!-- 5 SECONDS PROGRESS COUNTER -->
            <div class="w-full bg-neutral-900 h-2 rounded-full overflow-hidden border border-yellow-500/30 mb-3">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-yellow-600 via-yellow-200 to-yellow-500 w-0 transition-all duration-100 ease-linear"></div>
            </div>
            <p class="text-[11px] text-gray-400 font-mono"><span id="countdown-num">5</span> soniya... Yuklanmoqda (<span id="percent-num">0%</span>)</p>
        </div>
    </div>

    <!-- 2. LOGIN MODAL (TELEFON RAQAM) -->
    <div id="login-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/95 p-4">
        <div class="gold-card p-6 rounded-3xl max-w-sm w-full text-center">
            <i class="fa-solid fa-mobile-screen-button text-4xl gold-text mb-3"></i>
            <h2 class="text-xl font-bold gold-text mb-1">Tizimga Kirish</h2>
            <p class="text-xs text-gray-400 mb-5">Davom etish uchun telefon raqamingizni kiriting:</p>
            <form onsubmit="savePhone(event)">
                <input type="tel" id="user-phone" placeholder="+998 90 123 45 67" required class="w-full bg-black/80 border border-yellow-500/40 rounded-xl px-4 py-3 text-sm text-center text-white mb-4 focus:outline-none focus:border-yellow-400">
                <button type="submit" class="gold-button w-full py-3 rounded-xl text-xs uppercase tracking-wider">KIRISH VA SAQLASH</button>
            </form>
        </div>
    </div>

    <!-- 3. MAIN APPLICATION HEADER & NAV -->
    <div id="app-content" class="hidden relative z-10 flex-1 flex flex-col max-w-4xl w-full mx-auto h-full p-3 sm:p-5">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center p-4 gold-card rounded-2xl mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl border border-yellow-500/50 flex items-center justify-center bg-black">
                    <i class="fa-solid fa-crown gold-text text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black gold-text tracking-wider">QXVbrand</h1>
                    <p class="text-[10px] text-gray-400" id="user-display">Foydalanuvchi: +998...</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 p-2 border border-red-500/30 rounded-lg bg-red-950/20">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Chiqish
            </button>
        </header>

        <!-- NAVIGATION TABS -->
        <div class="flex gap-2 mb-4">
            <button onclick="switchTab('debt')" id="tab-debt" class="flex-1 py-3 gold-button rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-book"></i> 1-BO'LIM: QARZ DAFTARCHASI
            </button>
            <button onclick="switchTab('weather')" id="tab-weather" class="flex-1 py-3 bg-neutral-900 border border-yellow-500/30 rounded-xl text-xs font-bold text-gray-400 hover:text-white transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-sun-rain"></i> 2-BO'LIM: OB-HAVO (12 VILOYAT)
            </button>
        </div>

        <!-- SECTION 1: QARZ DAFTARCHASI -->
        <div id="section-debt" class="flex-1 overflow-y-auto space-y-4 pr-1">
            <div class="gold-card p-4 rounded-2xl">
                <h2 class="text-sm font-bold gold-text mb-3 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Yangi Qarz Qo'shish
                </h2>
                <form onsubmit="addDebt(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <input type="text" id="debt-name" placeholder="Ism/Shaxs" required class="bg-black/70 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:border-yellow-500 outline-none">
                    <input type="number" id="debt-amount" placeholder="Summa (so'm)" required class="bg-black/70 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:border-yellow-500 outline-none">
                    <select id="debt-type" class="bg-black/70 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white focus:border-yellow-500 outline-none">
                        <option value="give">Men berdim (Menga qarzdor)</option>
                        <option value="take">Men oldim (Men qarzdorman)</option>
                    </select>
                    <button type="submit" class="sm:col-span-3 gold-button py-2 rounded-xl text-xs mt-1">SAQLASH</button>
                </form>
            </div>

            <!-- QARZLAR RO'YXATI -->
            <div class="gold-card p-4 rounded-2xl">
                <h2 class="text-sm font-bold gold-text mb-3 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> Qarzlar Ro'yxati
                </h2>
                <div id="debt-list" class="space-y-2">
                    <!-- Dynamic debt cards inserted here -->
                </div>
            </div>
        </div>

        <!-- SECTION 2: OB-HAVO (12 VILOYAT) -->
        <div id="section-weather" class="hidden flex-1 overflow-y-auto pr-1">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3" id="weather-grid">
                <!-- 12 Viloyat weather cards -->
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. CANVAS ANIMATION
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.7 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
