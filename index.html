<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QXV AI - SUN'IY INTELLEKT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #weather-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
            50% { filter: drop-shadow(0 0 35px rgba(255,223,0,0.8)); }
        }

        .gold-text {
            background: linear-gradient(135deg, #FFF5C0 0%, #D4AF37 40%, #FFFFFF 50%, #B38728 60%, #AA7C11 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        .premium-badge {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728);
            color: #000;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .gold-card {
            background: rgba(12, 12, 12, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.35);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .gold-button {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 30%, #B38728 70%, #AA7C11 100%);
            color: #000;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }

        .gold-button:active {
            transform: scale(0.95);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased h-screen flex flex-col justify-between overflow-hidden relative selection:bg-yellow-500 selection:text-black">

    <!-- SHAMOL VA OLTIN YOMG'IR CANVAS EFFECT -->
    <canvas id="weather-canvas"></canvas>

    <!-- 1. SPLASH SCREEN (CHIROYLI KIRISH ANIMATSIYASI) -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
        <div class="text-center p-8 gold-card rounded-3xl max-w-sm w-full mx-4 relative z-10">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full border-2 border-yellow-500/60 flex items-center justify-center bg-yellow-500/10 shadow-2xl shadow-yellow-500/30">
                <i class="fa-solid fa-brain text-4xl gold-text"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider gold-text mb-2 uppercase">QXV AI SUN'IY INTELLEKTGA XUSH KELIBSIZ</h1>
            <p class="text-[10px] tracking-widest text-yellow-200/80 uppercase mb-4">Moliya, Biznes va Aqlli Savol-Javob Tizimi</p>
            
            <div class="inline-block px-4 py-1.5 rounded-full text-[10px] premium-badge uppercase mb-6">
                PREMIUM EDITION
            </div>

            <div class="w-10 h-10 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p class="text-xs text-yellow-1Xabar bo'sh yetib keldi yoki oldingi xabaringiz ko'rinmay qoldi. Nimani qaytadan jo'natishim kerakligini yoki qaysi savolingizga javob berishim lozimligini qayta yozib yuborsangiz, darhol yordam beraman!
