            50% { filter: drop-shadow(Aha, savolingizni tushundim! Siz sun'iy intellekt (AI) savol berganda unga javob bera oladigan bot yoki tizim yaratmoqchisiz va barcha ma'lumotlar **HTML** formatida bo'lishini xohlayapsiz. 

Ushbu loyihani amalga oshirish uchun tayyor **HTML + JavaScript** kodi quyida keltirilgan. Bu kod brauzerda ishlaydi va foydalanuvchiga (yoki AI savollariga) javob qaytaruvchi interaktiv interfeysni taqdim etadi.

### Tayyor HTML Kod (`index.html` sifatida saqlang):

```html
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Savol-Javob Tizimi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-box {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
        }
        .ai-message {
            background-color: #e9ecef;
            align-self: flex-start;
            color: #333;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }
        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            margin-left: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">AI Savol-Javob Bot</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">Salom! Men AI yordamchisiman. Menga savol bering yoki savolingizni kiriting!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Javob yoki savol yozing..." />
        <button onclick="sendMessage()">Yuborish</button>
    </div>
</div>

<script>
    // Oddiy bilimlar bazasi (AI qanday javob berishi uchun)
    const knowledgeBase = {
        "salom": "Salom! Sizga qanday yordam bera olaman?",
        "qandaysiz": "Rahmat, men sun'iy intellektman va har doim ishlashga tayyorman!",
        "isming nima": "Men sizga yordam beradigan AI modeliman.",
        "html nima": "HTML — bu veb-sahifalarning tuzilishini yaratish uchun ishlatiladigan belgilash tili.",
        "defolt": "Kechirasiz, bu savolga hozircha aniq javobim yo'q, lekin o'rganishda davom etyapman!"
    };

    function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim().toLowerCase();

        if (userText === "") return;

        // Foydalanuvchi xabarini chiqarish
        const userDiv = document.createElement("div");
        userDiv.className = "message user-message";
        userDiv.textContent = inputField.value;
        chatBox.appendChild(userDiv);

        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        // AI javobini aniqlash va chiqarish (1 soniya kechikish bilan)
        setTimeout(() => {
            const aiDiv = document.createElement("div");
            aiDiv.className = "message ai-message";
            
            let aiResponse = knowledgeBase["defolt"];
            
            // Bilimlar bazasidan kalit so'zni izlash
            for (let key in knowledgeBase) {
                if (userText.includes(key)) {
                    aiResponse = knowledgeBase[key];
                    break;
                }
            }

            aiDiv.textContent = aiResponse;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
    }

    // Enter tugmasi bosilganda ham yuborish
    document.getElementById("userInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
