<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QXVbrand QARZ DAFTARCHASI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); filter: drop-shadow(0 0 15px rgba(212,175,55,0.3)); }
            50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(212,175,55,0.6)); }
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gold-gradient-bg {
            background: radial-gradient(circle at center, #2a2010 0%, #0a0a0a 100%);
            animation: pulseGlow 6s infinite ease-in-out;
        }
        .gold-text {
            background: linear-gradient(135deg, #FFF5C0 0%, #D4AF37 50%, #AA7C11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-card {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.05);
        }
        .gold-button {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA7C11 100%);
            color: #000;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .gold-button:active {
            transform: scale(0.95);
        }
        .animate-card {
            animation: slideInUp 0.5s ease-out forwards;
        }
        .float-element {
            animation: floatAnim 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

    <!-- 1. ANIMATION SPLASH SCREEN (4 Soniya) -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center gold-gradient-bg transition-opacity duration-1000">
        <div class="text-center p-8 gold-card rounded-3xl max-w-xs w-full mx-4 float-element">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full border-2 border-yellow-500/50 flex items-center justify-center bg-yellow-500/10 shadow-lg shadow-yellow-500/20">
                <i class="fa-solid fa-wallet text-2xl gold-text"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-widest gold-text mb-1">QXV BRAND</h1>
            <p class="text-[10px] tracking-widest text-yellow-200/80 uppercase mb-6">Premium Qarz Daftari</p>
            <div class="w-10 h-10 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-xs font-medium text-yellow-100 tracking-wider animate-pulse">YUKLANMOQDA...</p>
        </div>
    </div>

    <!-- 2. AUTHENTICATION SCREEN (TELEFON & PAROL) -->
    <div id="auth-screen" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/95 p-4 backdrop-blur-md">
        <div class="w-full max-w-sm gold-card rounded-3xl p-6 shadow-2xl animate-card">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold gold-text">QXV BRAND</h2>
                <p id="auth-subtitle" class="text-xs text-gray-400 mt-1">Tizimga kiring yoki ro'yxatdan o'ting</p>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">TELEFON RAQAM</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400 text-sm"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" id="auth-phone" required placeholder="+998 90 123 45 67" class="w-full bg-black/60 border border-neutral-700 rounded-xl p-3 pl-10 text-white focus:border-yellow-500 focus:outline-none text-sm transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-yellow-400 mb-1">PAROL</label>
                    <div class="relative">
                        <span class="absolute"Qil" o‘zbek tilida holatga qarab bir nechta ma'noni anglatadi:

1. **Buyruq fe'li (qilmoq):** Biror ishni bajar, amalga oshir ("Ishu-amalni qil").
2. **Ot (qil):** Ot yoki boshqa hayvonlarning yolidan, dumidan chiqqan ingichka, qattiq soch/tuk (masalan, "qil ko'prik").
